[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smolagents-webui"
version = "0.1.0"
description = "Unofficial standalone WebUI for Hugging Face smolagents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "smol.ui contributors" },
]
dependencies = [
  "smolagents",
]

[project.optional-dependencies]
dev = [
  "build",
  "pytest>=8.1.0",
  "playwright",
]

[project.scripts]
smolagents-webui = "smolagents_webui.server:main"

[tool.pytest.ini_options]
addopts = "-sv --durations=0"

[tool.ruff]
line-length = 119
lint.ignore = [
  "F403",
  "E501",
]
lint.select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["smolagents_webui"]
lines-after-imports = 2

[tool.setuptools.packages.find]
where = ["src"]
include = ["smolagents_webui*"]
exclude = ["smolagents", "smolagents.*"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
smolagents_webui = ["static/*"]
